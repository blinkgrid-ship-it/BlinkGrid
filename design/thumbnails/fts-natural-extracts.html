<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="thumbnail-base.css">
<style>
  :root { --accent: #4C9A5B; }
  .panel-secondary { left: 150px; top: 480px; transform: rotate(-4deg); }
  .frame { left: 220px; top: 170px; transform: perspective(1600px) rotateY(5deg) rotateX(1.5deg) rotate(1deg); }
</style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="texture texture--dots"></div>
  <div class="corner-accent corner-accent--br"></div>
  <div class="panel-secondary">
    <img src="sources/fts-secondary.png" alt="">
  </div>
  <div class="frame">
    <div class="frame__chrome">
      <span class="frame__dot"></span><span class="frame__dot"></span><span class="frame__dot"></span>
    </div>
    <div class="frame__content">
      <img src="sources/fts-frame.png" alt="">
    </div>
  </div>
  <div class="vignette"></div>
</body>
</html>
